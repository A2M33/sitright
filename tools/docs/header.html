<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SitRight banner</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="banner.css">
<script src="trace.js"></script>
<style>
  /* the real preview window (tools/shoot_windows.py), camera replaced by the drawn stand-in */
  .window { position: absolute; left: 702px; top: 64px; height: 512px; display: block; }
</style>
</head>
<body>
<main class="sheet">
  <section class="intro">
    <img class="icon" src="_build/app-icon.png" alt="">
    <h1>SitRight</h1>
    <p class="sub">Posture, blink and break reminders from your webcam, in the system tray.</p>
    <p class="meta"><span class="pad" data-state="live"></span>Python · MediaPipe · runs offline</p>
  </section>

  <img class="window" src="_build/preview-slouching-dark.png" alt="">

  <p class="callout" id="c-frame" style="left:520px;top:120px;width:150px"><b>Your camera</b>Each frame is measured in memory, then dropped</p>
  <p class="callout lit" id="c-lamp" style="left:520px;top:430px;width:150px"><b>Slouching</b>After 30 s you get a notification</p>
</main>
<script>
  const k = 512 / 692, win = (x, y) => [702 + x * k, 64 + y * k];
  const right = id => { const r = document.getElementById(id).getBoundingClientRect(); return [r.right + 10, r.top + 11]; };
  traces([
    [right("c-frame"), win(16, 150), { r: 4 }],
    [right("c-lamp"), win(44, 539), { lit: true, r: 0, tail: 0 }],
  ]);
</script>
</body>
</html>
